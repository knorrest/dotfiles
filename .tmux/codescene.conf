# Set dir for the session (new windows start there). SESSION_DIR is set by tsl.
# The first window is assumed to already be in that dir.

attach -c "${SESSION_DIR}"
rename-window -t 1 nvim
send-keys -t 1 "nvim" C-m
split-window -h -t 1 -c "${SESSION_DIR}"
send-keys -t 1 "claude" C-m
select-pane -t 1 -L

# Create other windows

#new-window -n vim
#send-keys -t vim "vim ." C-m

new-window -n analysis
send-keys -t analysis "cd analysis" C-m
send-keys -t analysis "clj -M:dev:repl/basic" #C-m
new-window -n onprem
send-keys -t onprem "cd onprem" C-m
send-keys -t onprem "clj -M:dev:repl/basic" #C-m
new-window -n cloud
split-window
send-keys -t 0 "cd cloud/worker" C-m
send-keys -t 0 "bb repl" #C-m
send-keys -t 1 "cd cloud/web" C-m
send-keys -t 1 "bb repl" #C-m

